name: terraform

# 언제 실행하나: Terraform 코드나 이 파일이 바뀐 PR, main에 push될 때
on:
  pull_request:
    paths:
      - "ccs-infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "ccs-infra/terraform/**"

permissions:
  contents: read

env:
  TF_VERSION: 1.15.8
  TF_ROOT: ccs-infra/terraform

jobs:
  # 1단계: 형식·문법 검사 (AWS 접속 없음)
  fmt-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [pvt, aws]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: fmt
        run: terraform fmt -check -recursive -diff ${{ env.TF_ROOT }}
      - name: validate
        working-directory: ${{ env.TF_ROOT }}/envs/${{ matrix.env }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # 2단계: AWS plan (1단계 통과 시에만, OIDC로 읽기 전용 접속)
  aws-plan:
    needs: fmt-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}/envs/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: OIDC 토큰 내용 확인 (임시)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print('sub =',d['sub']);print('aud =',d['aud']);print('repository =',d['repository'])" "$TOKEN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock=false -no-color
